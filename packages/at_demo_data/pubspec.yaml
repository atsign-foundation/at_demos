name: at_demo_data
description:
  A Dart library that contains testable atSign credentials and demo variables
  which can be used for testing with the local test environment.
homepage: https://www.atsign.dev
documentation: https://atsign.dev/docs/
repository: https://github.com/atsign-foundation/at_demos

version: 2.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  crypton: ^2.2.1
  encrypt: ^5.0.3
  test: ^1.17.10
  test_cov: ^1.0.1
